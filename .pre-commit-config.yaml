repos:
  - repo: local
    hooks:
      - id: markdownlint
        name: markdownlint (task lint:markdown)
        entry: task lint:markdown
        language: system
        files: \.md$
        pass_filenames: false
        stages: [pre-commit]
      - id: ruff
        name: ruff (task lint:python)
        entry: task lint:python
        language: system
        files: \.py$
        pass_filenames: false
        stages: [pre-commit]
