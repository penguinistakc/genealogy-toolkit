[project]
name = "genealogy-toolkit"
version = "0.2.0"
description = "Tools for genealogical research kept in a plain-text Research Vault"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "pyyaml>=6.0.3",
]

[project.scripts]
gtool = "genealogy_toolkit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build==0.13.1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
