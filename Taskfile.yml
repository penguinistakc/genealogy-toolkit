# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

vars:
  GREETING: Hello, world!

tasks:
  default:
    desc: Print a greeting message
    cmds:
      - echo "{{.GREETING}}"
    silent: true

  setup:
    desc: One-time developer setup (installs git hooks via pre-commit)
    cmds:
      - pre-commit install
    silent: true

  lint:markdown:
    desc: Lint Markdown files with markdownlint-cli2 (via npx, pinned to an exact version)
    cmds:
      - npx --yes markdownlint-cli2@0.23.3 "**/*.md"
    silent: true

  lint:python:
    desc: Lint and format-check Python with ruff
    cmds:
      - uv run ruff check
      - uv run ruff format --check
    silent: true

  lint:
    desc: Run all linters
    deps:
      - lint:markdown
      - lint:python
    silent: true

  test:
    desc: Run the test suite with pytest
    cmds:
      - uv run pytest {{.CLI_ARGS}}
    silent: true
